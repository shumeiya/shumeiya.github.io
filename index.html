<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shumi — Product & UX Designer</title>
    <!-- Umami analytics: page views, per-route stats, visitor country/city -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="032b44d0-a2c5-4e90-9ed2-e82eb69e2ff3"
    ></script>
    <script>
      (function () {
        // A first visit is always light and English, whatever the device or
        // browser is set to. Only a choice made with the site's own switches
        // is stored, and it wins from then on. (The keys are `-v2` because the
        // old `theme` / `lang` keys hold values guessed from system settings.)
        var isDark = localStorage.getItem("theme-v2") === "dark"
        document.documentElement.classList.toggle("dark", isDark)

        // Resolved before first paint, so the CJK font stack is already in
        // force and the page never flashes in one language before swapping
        // to the other.
        var lang = localStorage.getItem("lang-v2") === "zh" ? "zh" : "en"
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en"
        document.documentElement.setAttribute("data-lang", lang)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
